name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nova_test
          POSTGRES_PASSWORD: nova_test_password
          POSTGRES_DB: nova_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova_test -d nova_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://nova_test:nova_test_password@localhost:5432/nova_test
      RUN_INTEGRATION_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Audit full dependency lockfile
        run: npm audit --audit-level=low
      - run: npm run migrate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload sanitized authorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorization-matrix
          path: artifacts/security-matrix.json
          if-no-files-found: warn
          retention-days: 14
